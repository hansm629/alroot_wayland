plugins {
    id 'com.android.application'
}

android {
    namespace 'com.alroot.wayland'
    compileSdk 35
    ndkVersion '27.3.13750724'
    defaultConfig {
        applicationId 'com.alroot.wayland'
        minSdk 26
        // Termux's app-data executable entrypoints require targetSdk <= 28 on Android.
        targetSdk 28
        versionCode 16
        versionName '0.1.15-p13-ime-caret-sync'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_shared' } }
    }
    externalNativeBuild { cmake { path file('../native/CMakeLists.txt'); version '3.22.1' } }
    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            // Never assume the ephemeral CI debug key can join the installed Termux shared UID.
        }
    }
    packaging {
        jniLibs { useLegacyPackaging true }
    }
    lint {
        // Termux's shared-UID executable bridge uses the legacy target for P01.
        // Developer-only APK: other lint checks remain enabled.
        disable 'ExpiredTargetSdkVersion'
    }
}

def keyFile = System.getenv('ALROOT_SIGNING_KEYSTORE')
def ciStorePassword = System.getenv('ALROOT_SIGNING_STORE_PASSWORD')
def ciAlias = System.getenv('ALROOT_SIGNING_KEY_ALIAS')
def ciKeyPassword = System.getenv('ALROOT_SIGNING_KEY_PASSWORD')
if (keyFile && ciStorePassword && ciAlias && ciKeyPassword) {
    android.signingConfigs {
        create('termuxCompatible') {
            storeFile file(keyFile)
            storePassword = ciStorePassword
            keyAlias = ciAlias
            keyPassword = ciKeyPassword
        }
    }
    android.buildTypes.release.signingConfig = android.signingConfigs.termuxCompatible
}
