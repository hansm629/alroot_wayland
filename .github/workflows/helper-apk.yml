name: P01 Android Helper APK
on:
  workflow_dispatch:
  push:
    branches: [main, 'p01/**', 'feature/**']
  pull_request:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Toolchain
        run: |
          # ubuntu-24.04 runner already provides Android command-line tools.
          # setup-android@v3 attempts the now-retired "tools" package and fails.
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.3.13750724"
      - name: Check pinned binary hashes
        run: |
          echo '2daff7500b6acee55291567d786653ba75f5aecf5a5e648fce4c10fe6bc7a8ea  app/src/main/jniLibs/arm64-v8a/libwayland-server.so' | sha256sum -c
          echo '8855ba6dc12e9abf40729481a7a99aa391ac7b2e77bad4fbe0bb51cd66216c0e  app/src/main/jniLibs/arm64-v8a/libffi.so' | sha256sum -c
      - name: Configure signing credentials
        if: github.event_name != 'pull_request'
        env:
          PRIVATE_KEY_B64: ${{ secrets.ALROOT_SIGNING_KEYSTORE_B64 }}
          PRIVATE_STORE_PASS: ${{ secrets.ALROOT_SIGNING_STORE_PASSWORD }}
          PRIVATE_ALIAS: ${{ secrets.ALROOT_SIGNING_KEY_ALIAS }}
          PRIVATE_KEY_PASS: ${{ secrets.ALROOT_SIGNING_KEY_PASSWORD }}
        run: |
          if [ -n "$PRIVATE_KEY_B64" ] && [ -n "$PRIVATE_STORE_PASS" ] && [ -n "$PRIVATE_ALIAS" ] && [ -n "$PRIVATE_KEY_PASS" ]; then
            umask 077
            printf '%s' "$PRIVATE_KEY_B64" | base64 --decode > "$RUNNER_TEMP/alroot-signing.jks"
            echo "ALROOT_SIGNING_KEYSTORE=$RUNNER_TEMP/alroot-signing.jks" >> "$GITHUB_ENV"
            echo "ALROOT_SIGNING_STORE_PASSWORD=$PRIVATE_STORE_PASS" >> "$GITHUB_ENV"
            echo "ALROOT_SIGNING_KEY_ALIAS=$PRIVATE_ALIAS" >> "$GITHUB_ENV"
            echo "ALROOT_SIGNING_KEY_PASSWORD=$PRIVATE_KEY_PASS" >> "$GITHUB_ENV"
            echo "ALROOT_CI_SIGNED=1" >> "$GITHUB_ENV"
          fi
      - name: Build release
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleRelease > "$RUNNER_TEMP/build.log" 2>&1 || {
            tail -65 "$RUNNER_TEMP/build.log"
            exit 1
          }
      - name: Collect artifacts
        if: always()
        run: |
          mkdir -p artifact
          find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -exec cp '{}' artifact/ \; 2>/dev/null || true
          cp "$RUNNER_TEMP/build.log" artifact/build.log 2>/dev/null || true
          find app/build/intermediates/cxx -type f -name '*.so' -path '*/obj/*' -exec sh -c 'mkdir -p artifact/native-symbols; cp "$1" artifact/native-symbols/' sh '{}' \; 2>/dev/null || true
          {
            echo "commit=$GITHUB_SHA"
            echo "run=${{ github.run_id }}"
            echo "abi=arm64-v8a"
            echo "targetSdk=28"
            echo "ndk=27.3.13750724"
            echo "signed=${ALROOT_CI_SIGNED:-0}"
            cat upstream.lock
          } > artifact/manifest.txt
          (cd artifact && find . -type f -print0 | xargs -0 -r sha256sum > SHA256SUMS)
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alroot-wayland-p01-${{ github.sha }}
          path: artifact/
          if-no-files-found: warn
          retention-days: 14
